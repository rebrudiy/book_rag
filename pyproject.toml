[project]
name = "book-rag"
version = "0.2.0"
description = "An open, local-first book research library with verifiable citations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28", "beautifulsoup4>=4.12", "defusedxml>=0.7", "pypdf>=5", "typer>=0.15", "numpy>=2"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.4"]
dev = ["pytest>=8", "ruff>=0.11", "ty>=0.0.5", "playwright>=1.50"]

[project.scripts]
bookrag = "book_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.hatch.build.targets.wheel]
packages = ["src/book_rag"]
