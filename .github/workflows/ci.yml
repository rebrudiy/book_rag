name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run playwright install --with-deps chromium
      - name: Real browser workflows over the offline demo
        run: |
          uv run bookrag demo
          uv run bookrag serve > /tmp/bookrag-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          uv run python - <<'PY'
          import time
          import httpx
          for attempt in range(100):
              try:
                  httpx.get('http://127.0.0.1:8000/api/health', timeout=1).raise_for_status()
                  break
              except httpx.HTTPError:
                  time.sleep(.2)
          else:
              raise RuntimeError('Browser test server did not become ready')
          PY
          uv run python tests/browser_smoke.py --artifacts artifacts/browser-ci
      - name: Verified semantic-subset coverage in the browser
        run: uv run python scripts/browser_partial_coverage.py --real-backend --artifacts artifacts/browser-ci/partial-coverage
      - name: Available-book shelves and scoped reading in the browser
        run: uv run python scripts/browser_starter_shelf.py --artifacts artifacts/browser-ci/starter-shelf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/browser-ci
          retention-days: 7
  compact-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --extra dev --extra ann
      - name: Source-bound compact indexes with isolated native workers
        run: >-
          uv run pytest -q
          tests/test_experimental_ivfpq.py
          tests/test_incremental_ivfpq.py
          tests/test_semantic_overlay.py
          tests/test_semantic_overlay_integration.py
          tests/test_semantic_batches.py
          tests/test_semantic_batch_overlay.py
          tests/test_semantic_batch_dispatch.py
